name: hack-61391193

services:
  postgres:
    image: postgres:16.15-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT}:6333"
      - "${QDRANT_GRPC_PORT}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    restart: "no"

  laya:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX: ${LAYA_TORCH_INDEX}
    restart: unless-stopped
    ports:
      - "${LAYA_PORT}:8000"
    environment:
      LAYA_DEVICE: ${LAYA_DEVICE}
      LAYA_MODEL: ${LAYA_MODEL}
      LAYA_MODEL_PATH: ${LAYA_MODEL_PATH}
      LAYA_PRELOAD: ${LAYA_PRELOAD}
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: 8000
      LAYA_API_KEY: ${LAYA_API_KEY}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE}
      HF_TOKEN: ${HF_TOKEN}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS}
      USE_TF: "0"
      BGE_M3_PATH: /models/bge-m3
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET}
      S3_REGION: ${MINIO_REGION}
    volumes:
      - hf-cache:/home/laya/.cache/huggingface
      - ./checkpoints:/models/checkpoints:ro
      - ./models:/models:ro
      - ./examples:/opt/laya/examples:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    init: true

  laya-smoke:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX: ${LAYA_TORCH_INDEX}
    environment:
      LAYA_DEVICE: ${LAYA_DEVICE}
      LAYA_MODEL: ${LAYA_MODEL}
      LAYA_MODEL_PATH: ${LAYA_MODEL_PATH}
      USE_TF: "0"
      HF_TOKEN: ${HF_TOKEN}
      BGE_M3_PATH: /models/bge-m3
    volumes:
      - hf-cache:/home/laya/.cache/huggingface
      - ./checkpoints:/models/checkpoints:ro
      - ./models:/models:ro
      - ./examples:/opt/laya/examples:ro
    entrypoint: ["python", "/opt/laya/entrypoint.py"]
    command: ["python", "-m", "app.smoke", "/opt/laya/examples/request.json"]

  laya-train:
    profiles: ["train"]
    build:
      context: .
      dockerfile: Dockerfile.train
    environment:
      LAYA_DEVICE: cuda
      USE_TF: "0"
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /workspace/.cache/huggingface
      BGE_M3_PATH: /workspace/models/bge-m3
    volumes:
      - ./:/workspace
      - hf-cache:/workspace/.cache/huggingface
    working_dir: /workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LAYA_GPU_ID}"]
              capabilities: [gpu]

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
  hf-cache:
