name: hack-61391193

services:
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_ORIGIN: http://backend-akim:8080
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      BACKEND_ORIGIN: http://backend-akim:8080
    depends_on:
      backend-akim:
        condition: service_healthy

  backend-akim:
    build:
      context: .
      dockerfile: backend-akim/Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}"
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      SIMULATION_LLM_URL: ${SIMULATION_LLM_URL:-https://api.openai.com/v1/chat/completions}
      SIMULATION_LLM_MODEL: ${SIMULATION_LLM_MODEL:-gpt-4.1-mini-2025-04-14}
      # Falls back to OPENAI_API_KEY so the secret is not duplicated in .env.
      SIMULATION_LLM_API_KEY: ${SIMULATION_LLM_API_KEY:-${OPENAI_API_KEY:-}}
      SIMULATION_LLM_TIMEOUT_MS: ${SIMULATION_LLM_TIMEOUT_MS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/db"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:16.15-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
