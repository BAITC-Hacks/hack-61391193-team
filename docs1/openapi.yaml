openapi: 3.1.0
info:
  title: Аким на 5 часов — Astana Quality of Life Score
  description: "Синтетическая модель хакатона: выберите ровно 5 мероприятий на бюд\
    жет до 100. Расчёт и поиск лучшего набора детерминированные; объяснение формир\
    уется LLM при настройке API или по шаблону. Откройте POST /api/simulation/calculate,\
    \ нажмите Try it out и Execute: пример уже заполнен. Модель v2-saraishyk: 6 ра\
    йонов, включая Сарайшык, и 16 мероприятий. M15 (уборка снега) и M16 (ливневая\
    \ канализация) используют синтетические стоимость, сроки и эффекты. Score прим\
    ера = 56.31781049, базовый = 52.33242049. Для сохранения в PostgreSQL зарегист\
    рируйтесь через POST /api/v1/auth/register или войдите через /api/v1/auth/login,\
    \ введите JWT accessToken через Authorize (BearerAuth) и используйте раздел History."
  version: v1
servers:
- url: http://localhost:8081
  description: Generated server url
tags:
- name: History
  description: Сохранение и история сценариев текущего пользователя. Требуется профиль
    postgres.
- name: Admin
  description: Доступ только для аккаунтов с ролью ADMIN
- name: Auth
  description: "Регистрация, вход и текущий аккаунт. Требуется профиль postgres."
- name: Simulation
  description: Расчёт Astana Quality of Life Score и объяснение результата
paths:
  /api/v1/users/anonymous:
    post:
      tags:
      - History
      summary: Создать анонимный профиль для истории (совместимость)
      description: "Без тела запроса. Сохраните accessToken на клиенте: он возвращ\
        ается один раз. Один профиль создаётся один раз для браузера; повторный POST\
        \ создаст другой профиль. Токен бессрочный. Для новых пользователей исполь\
        зуйте /api/v1/auth/register и JWT."
      operationId: createUser
      responses:
        "201":
          description: "Профиль сохранён, токен выдан"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnonymousUserResponse"
        "503":
          description: Хранилище недоступно или профиль postgres выключен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      deprecated: true
  /api/v1/simulations:
    get:
      tags:
      - History
      summary: История текущего профиля
      description: "Краткие результаты, сначала новые: createdAt DESC, id DESC. Па\
        раметр userId не принимается: владелец определяется по токену."
      operationId: list
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: string
          default: "20"
          maximum: 100
          minimum: 1
      - name: offset
        in: query
        required: false
        schema:
          type: string
          default: "0"
          minimum: 0
      responses:
        "200":
          description: "Страница истории, в том числе пустая"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SimulationHistoryPage"
        "400":
          description: Некорректные limit или offset
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Токен отсутствует или недействителен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: Хранилище недоступно или профиль postgres выключен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - BearerAuth: []
      - AnonymousBearer: []
    post:
      tags:
      - History
      summary: Рассчитать и сохранить сценарий
      description: "Валидирует 5 решений, рассчитывает Score и сохраняет исходный\
        \ выбор и полный результат. 201 возвращается после завершения транзакции.\
        \ Каждый успешный POST создаёт новую запись."
      operationId: save
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationRequest"
            example:
              decisions:
              - measureId: M7
                districtId: nura
              - measureId: M8
                districtId: nura
              - measureId: M10
                districtId: nura
              - measureId: M12
              - measureId: M5
                districtId: saryarka
        required: true
      responses:
        "201":
          description: Сценарий сохранён. Location указывает маршрут чтения
          headers:
            Location:
              description: Маршрут чтения сохранённого сценария
              style: simple
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SavedSimulationResponse"
        "400":
          description: Некорректный JSON или отсутствует тело
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Токен отсутствует или недействителен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Невалидный сценарий; запись не создаётся
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "503":
          description: Хранилище недоступно или профиль postgres выключен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - BearerAuth: []
      - AnonymousBearer: []
  /api/simulation/calculate:
    post:
      tags:
      - Simulation
      summary: Рассчитать Score для 5 мероприятий
      description: "Проверяет бюджет, повторы, лимит направления, районы и конфлик\
        ты. Применяет lag, synergy и clip, находит глобально лучший набор и сравни\
        вает его с выбором пользователя. При настроенном LLM передаёт оба рассчита\
        нных результата для объяснения; иначе использует шаблон."
      operationId: calculate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationRequest"
            examples:
              'Пример v2-saraishyk: 95 единиц → 56.31781049':
                description: "Пример v2-saraishyk: 95 единиц → 56.31781049"
                value:
                  decisions:
                  - measureId: M7
                    districtId: nura
                  - measureId: M8
                    districtId: nura
                  - measureId: M10
                    districtId: nura
                  - measureId: M12
                  - measureId: M5
                    districtId: saryarka
              'Школа в Сарайшыке: 95 единиц → 54.95216719':
                description: "Школа в Сарайшыке: 95 единиц → 54.95216719"
                value:
                  decisions:
                  - measureId: M7
                    districtId: saraishyk
                  - measureId: M8
                    districtId: nura
                  - measureId: M10
                    districtId: nura
                  - measureId: M12
                  - measureId: M5
                    districtId: saryarka
              'Уборка снега и ливневая канализация: 85 единиц':
                description: "Уборка снега и ливневая канализация: 85 единиц"
                value:
                  decisions:
                  - measureId: M4
                    districtId: esil
                  - measureId: M7
                    districtId: saraishyk
                  - measureId: M10
                    districtId: nura
                  - measureId: M15
                    districtId: nura
                  - measureId: M16
                    districtId: nura
        required: true
      responses:
        "200":
          description: Результат и объяснение
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SimulationResult"
        "422":
          description: "Невалидный набор: errors содержит коды и причины; Score не\
            \ рассчитывается"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "400":
          description: Некорректный JSON или отсутствует тело
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/simulation/calculate:
    post:
      tags:
      - Simulation
      summary: Рассчитать Score для 5 мероприятий
      description: "Проверяет бюджет, повторы, лимит направления, районы и конфлик\
        ты. Применяет lag, synergy и clip, находит глобально лучший набор и сравни\
        вает его с выбором пользователя. При настроенном LLM передаёт оба рассчита\
        нных результата для объяснения; иначе использует шаблон."
      operationId: calculate_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationRequest"
            examples:
              'Пример v2-saraishyk: 95 единиц → 56.31781049':
                description: "Пример v2-saraishyk: 95 единиц → 56.31781049"
                value:
                  decisions:
                  - measureId: M7
                    districtId: nura
                  - measureId: M8
                    districtId: nura
                  - measureId: M10
                    districtId: nura
                  - measureId: M12
                  - measureId: M5
                    districtId: saryarka
              'Школа в Сарайшыке: 95 единиц → 54.95216719':
                description: "Школа в Сарайшыке: 95 единиц → 54.95216719"
                value:
                  decisions:
                  - measureId: M7
                    districtId: saraishyk
                  - measureId: M8
                    districtId: nura
                  - measureId: M10
                    districtId: nura
                  - measureId: M12
                  - measureId: M5
                    districtId: saryarka
              'Уборка снега и ливневая канализация: 85 единиц':
                description: "Уборка снега и ливневая канализация: 85 единиц"
                value:
                  decisions:
                  - measureId: M4
                    districtId: esil
                  - measureId: M7
                    districtId: saraishyk
                  - measureId: M10
                    districtId: nura
                  - measureId: M15
                    districtId: nura
                  - measureId: M16
                    districtId: nura
        required: true
      responses:
        "200":
          description: Результат и объяснение
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SimulationResult"
        "422":
          description: "Невалидный набор: errors содержит коды и причины; Score не\
            \ рассчитывается"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "400":
          description: Некорректный JSON или отсутствует тело
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: Зарегистрировать пользователя и получить JWT
      description: Email уникален без учёта регистра. Новый аккаунт всегда имеет роль
        USER.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: user@example.com
              password: Password123!
              username: user
        required: true
      responses:
        "201":
          description: Аккаунт сохранён; JWT готов к использованию
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Некорректные поля
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Email уже занят или зарезервирован
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: База данных недоступна или профиль postgres выключен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Войти по email и паролю
      description: Выдаёт JWT с ограниченным сроком действия. Email или пароль неверен
        — одинаковый ответ 401.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: admin@example.com
              password: Admin
        required: true
      responses:
        "200":
          description: JWT и профиль пользователя
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Неверный email или пароль
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: База данных недоступна или профиль postgres выключен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/simulations/{id}:
    get:
      tags:
      - History
      summary: Прочитать сохранённый сценарий
      description: Возвращает исходные решения и сохранённый результат без нового
        расчёта. Чужой и отсутствующий сценарии одинаково возвращают 404.
      operationId: find
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Сохранённый сценарий
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SavedSimulationResponse"
        "400":
          description: id должен быть UUID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Токен отсутствует или недействителен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Сценарий не найден в текущем профиле
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: Хранилище недоступно или профиль postgres выключен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - BearerAuth: []
      - AnonymousBearer: []
  /api/v1/simulation/bootstrap:
    get:
      tags:
      - simulation-bootstrap-controller
      operationId: bootstrap
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
  /api/v1/simulation/baseline:
    get:
      tags:
      - Simulation
      summary: Базовые показатели и Score без действий
      description: "Score модели v2-saraishyk = 52.33242049. Это справочный расчёт\
        , не сценарий из 5 решений."
      operationId: baseline
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SimulationResult"
  /api/simulation/baseline:
    get:
      tags:
      - Simulation
      summary: Базовые показатели и Score без действий
      description: "Score модели v2-saraishyk = 52.33242049. Это справочный расчёт\
        , не сценарий из 5 решений."
      operationId: baseline_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SimulationResult"
  /api/v1/measures:
    get:
      tags:
      - catalog-controller
      operationId: getMeasures
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeasureResponse"
  /api/v1/measures/M3/context:
    get:
      tags:
      - lrt-context-controller
      summary: Официальные сведения о ЛРТ Астаны для M3
      description: Справочный снимок с датами и источниками. Геометрия маршрута доступна
        отдельно в /api/v1/map/lrt; покрытие неполное. Эти данные не меняют Score.
      operationId: getContext
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
  /api/v1/map/roads:
    get:
      tags:
      - map-data-controller
      operationId: getRoads
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/v1/map/pois:
    get:
      tags:
      - map-data-controller
      operationId: getPois
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/v1/map/parks:
    get:
      tags:
      - map-data-controller
      operationId: getParks
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/v1/map/lrt:
    get:
      tags:
      - map-data-controller
      operationId: getLrt
      responses:
        "200":
          description: GeoJSON ЛРТ для M3 с метаданными об источнике и неполноте
          content:
            application/geo+json:
              schema:
                type: object
  /api/v1/map/layers:
    get:
      tags:
      - map-data-controller
      operationId: getLayers
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MapLayersResponse"
  /api/v1/map/districts:
    get:
      tags:
      - map-data-controller
      operationId: getDistricts
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/v1/map/district-stats:
    get:
      tags:
      - map-data-controller
      operationId: getDistrictStats
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/v1/map/city-boundary:
    get:
      tags:
      - map-data-controller
      operationId: getCityBoundary
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/v1/districts:
    get:
      tags:
      - catalog-controller
      operationId: getDistricts_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DistrictResponse"
  /api/v1/districts/{id}:
    get:
      tags:
      - catalog-controller
      operationId: getDistrict
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DistrictResponse"
  /api/v1/districts/{id}/measures:
    get:
      tags:
      - catalog-controller
      operationId: getMeasuresForDistrict
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DistrictMeasureResponse"
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Получить текущий аккаунт по JWT
      operationId: me
      responses:
        "200":
          description: "Публичные поля профиля, без пароля"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          description: "JWT отсутствует, недействителен или истёк"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Анонимный профиль не является зарегистрированным аккаунтом
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: База данных недоступна или профиль postgres выключен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - BearerAuth: []
  /api/v1/admin/me:
    get:
      tags:
      - Admin
      summary: Проверить вход в админку и получить профиль администратора
      operationId: me_1
      responses:
        "200":
          description: Текущий администратор
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          description: Требуется действующий JWT
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Аккаунт не является администратором
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: Хранилище недоступно или профиль postgres выключен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - BearerAuth: []
components:
  schemas:
    AnonymousUserResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        accessToken:
          type: string
          description: Секретный токен профиля. Возвращается только при создании;
            сохраните на клиенте.
        tokenType:
          type: string
          example: Bearer
        createdAt:
          type: string
          format: date-time
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    Decision:
      type: object
      properties:
        measureId:
          type: string
          description: Уникальный ID из GET /api/v1/measures
          example: M7
          pattern: "^M([1-9]|1[0-6])$"
        districtId:
          type: string
